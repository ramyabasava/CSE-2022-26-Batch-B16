<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/60 p-10 border border-slate-100">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-10">
            <div class="bg-green-100 p-3 rounded-2xl mb-4">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900">Welcome Back</h1>
            <p class="text-slate-500 mt-2 text-center">Enter your credentials to access your dashboard</p>
        </div>

        <!-- FLASH MESSAGES: Show errors like "Invalid Credentials" -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="bg-red-50 text-red-600 p-4 rounded-2xl mb-6 text-sm font-bold text-center border border-red-100">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- FORM FIX: method="POST" and action pointing to Flask login route -->
        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Email Address</label>
                <!-- Added name="email" -->
                <input type="email" name="email" placeholder="name@example.com" required
                    class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none">
            </div>

            <div>
                <div class="flex justify-between mb-2">
                    <label class="text-sm font-bold text-slate-700">Password</label>
                    <a href="#" class="text-xs font-semibold text-green-600 hover:underline">Forgot password?</a>
                </div>
                <!-- Added name="password" -->
                <input type="password" name="password" placeholder="••••••••" required
                    class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none">
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold hover:bg-green-700 transition shadow-lg shadow-green-200 mt-4">
                Sign In
            </button>
        </form>

        <!-- Footer -->
        <p class="text-center text-slate-500 mt-10 text-sm">
            Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-green-600 font-bold hover:underline">Create one</a>
        </p>
    </div>

</body>
</html>
