<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-2xl">
        <div class="text-center mb-10">
            <div class="bg-slate-900 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">🌱</div>
            <h1 class="text-2xl font-black text-slate-900">Admin Portal</h1>
            <p class="text-slate-500 text-sm">Restricted access for AgriScan Administrators</p>
        </div>
        <!-- Add this inside your card, above the form -->
{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <div class="bg-red-100 text-red-600 p-4 rounded-xl mb-4 text-xs font-bold">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
        <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-6">
            <div>
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2">Admin Email</label>
                <input name="email" type="email"  required class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-4 focus:ring-slate-900/5">
            </div>
            <div>
                <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2">Security Password</label>
                <input name="password" type="password" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-200 outline-none focus:ring-4 focus:ring-slate-900/5">
            </div>
            <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition shadow-xl">
                Unlock Command Center
            </button>
        </form>
    </div>
</body>
</html>
