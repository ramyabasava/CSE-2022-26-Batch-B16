<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Plant Image - AgriScan</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{font-family:'Plus Jakarta Sans',sans-serif;}
</style>

</head>

<body class="bg-slate-50 text-slate-900">

<!-- NAVBAR -->
<nav class="bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-8">
<span class="text-xl font-bold text-slate-800">AgriScan</span>

<div class="hidden md:flex items-center gap-6">
<a href="/dashboard" class="text-sm font-semibold text-slate-500">Dashboard</a>
<a href="/upload" class="text-sm font-semibold text-green-600">New Scan</a>
<a href="/history" class="text-sm font-semibold text-slate-500">History</a>
</div>

</div>

<div class="w-10 h-10 bg-green-600 text-white rounded-full flex items-center justify-center font-bold">
U
</div>
</nav>


<!-- MAIN -->
<main class="max-w-3xl mx-auto px-6 py-12">

<div class="text-center mb-10">
<h1 class="text-4xl font-extrabold text-slate-900 mb-2">
Upload Plant Image
</h1>

<p class="text-slate-500">
Upload a clear leaf photo to detect plant disease.
</p>
</div>


<div class="bg-white rounded-[2rem] shadow-xl p-10 border border-slate-100">

<form method="POST" enctype="multipart/form-data" class="space-y-6">

<!-- Upload Area -->
<label class="border-2 border-dashed border-slate-200 rounded-2xl p-16 flex flex-col items-center justify-center bg-slate-50 hover:bg-green-50 hover:border-green-400 transition cursor-pointer">

<svg class="w-10 h-10 text-green-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
</path>
</svg>

<p class="font-semibold text-slate-700 mb-1">
Click to select image
</p>

<p class="text-sm text-slate-400">
PNG, JPG, WEBP (Max 10MB)
</p>

<input type="file" name="file" required class="hidden">

</label>


<!-- Button -->
<button type="submit"
class="w-full bg-green-600 text-white py-4 rounded-xl font-bold hover:bg-green-700 transition">

Analyze Disease

</button>

</form>


<!-- Steps -->
<div class="grid grid-cols-3 gap-6 mt-10 pt-10 border-t">

<div class="text-center">
<p class="text-xs font-bold uppercase text-slate-700 mb-1">
1. Take Photo
</p>
<p class="text-xs text-slate-400">
Capture clear leaf image
</p>
</div>

<div class="text-center">
<p class="text-xs font-bold uppercase text-slate-700 mb-1">
2. Upload
</p>
<p class="text-xs text-slate-400">
Select image file
</p>
</div>

<div class="text-center">
<p class="text-xs font-bold uppercase text-slate-700 mb-1">
3. AI Result
</p>
<p class="text-xs text-slate-400">
Get disease prediction
</p>
</div>

</div>

</div>

</main>

</body>
</html>
