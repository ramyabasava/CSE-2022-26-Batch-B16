<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AgriScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 md:p-10">

    <div class="max-w-2xl w-full bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/60 p-8 md:p-12 border border-slate-100">
        <!-- Header -->
        <div class="flex flex-col items-center mb-8">
            <div class="bg-green-100 p-3 rounded-2xl mb-4">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-900 text-center">Join AgriScan</h1>
            <p class="text-slate-500 mt-2 text-center text-sm">Create your account to start protecting your crops with AI.</p>
        </div>

        <!-- FORM FIX: method="POST" and action pointing to Flask route -->
        <form action="{{ url_for('register') }}" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Full Name -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Full Name</label>
                    <input type="text" name="full_name" required
                        class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none">
                </div>

                <!-- Email Address -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Email Address</label>
                    <input type="email" name="email" required
                        class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none">
                </div>

                <!-- Phone Number -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Phone Number</label>
                    <input type="tel" name="phone" required
                        class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none">
                </div>

                <!-- Location -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Location</label>
                    <input type="text" name="location" placeholder="City, State" required
                        class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none">
                </div>

                <!-- User Role -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">User Role</label>
                    <select name="role" required class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none appearance-none cursor-pointer">
                        <option value="" disabled selected>Select your role</option>
                        <option value="farmer">Farmer</option>
                        <option value="researcher">Researcher / Scientist</option>
                        <option value="expert">Agricultural Expert</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                    <input type="password" name="password" placeholder="••••••••" required
                        class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none">
                </div>

                <!-- Confirm Password (Used for UI check) -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="••••••••" required
                        class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border border-slate-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition outline-none">
                </div>
            </div>

            <div class="flex items-start gap-3 pt-2">
                <input type="checkbox" required class="mt-1 w-4 h-4 rounded text-green-600 border-slate-300 focus:ring-green-500">
                <p class="text-xs text-slate-500 leading-normal">
                    I agree to the <a href="#" class="text-green-600 font-semibold underline">Terms of Service</a>.
                </p>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold hover:bg-green-700 transition shadow-lg shadow-green-200">
                Create Free Account
            </button>
        </form>

        <!-- Footer -->
        <p class="text-center text-slate-500 mt-8 text-sm">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-green-600 font-bold hover:underline">Log in</a>
        </p>
    </div>

</body>
</html>
